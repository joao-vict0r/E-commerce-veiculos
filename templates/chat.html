<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chat - Bot de Ajuda</title>
    <style>
      :root{
        --blue-600:#0b6bff;
        --blue-700:#0056d6;
        --green-600:#1aa261;
        --muted:#f3f6f9;
        --surface:#ffffff;
      }
      html,body{height:100%;margin:0;padding:0;font-family:Inter, Arial, Helvetica, sans-serif;background:transparent}
      body{display:flex;flex-direction:column}
      h1{font-size:18px;margin:8px 10px;padding:0;color:var(--blue-700)}
      #messages{border-radius:10px;padding:12px;flex:1;overflow:auto;background:linear-gradient(180deg,#fbfdff,#f7fbff);box-shadow:inset 0 1px 0 rgba(0,0,0,0.02)}
      .msg{margin:8px 0;display:flex}
      .bot{justify-content:flex-start}
      .user{justify-content:flex-end}
      .bubble{max-width:78%;padding:10px 12px;border-radius:14px;line-height:1.3;box-shadow:0 4px 10px rgba(13,38,76,0.06)}
      .bubble.bot{background:var(--green-600);color:#fff;border-bottom-left-radius:4px}
      .bubble.user{background:var(--blue-600);color:#fff;border-bottom-right-radius:4px}
      #controls{margin:10px}
      #identifyBox input[type=text], #inputBox input, #leadBox input, #leadBox textarea{width:100%;box-sizing:border-box;padding:8px;margin:6px 0;border:1px solid #e3eefc;border-radius:8px;background:#fff}
      #identifyBox label{font-size:13px;margin-right:8px;color:#234}
      #identify, #send, #lead_send{background:var(--blue-600);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
      #identify:hover,#send:hover,#lead_send:hover{background:var(--blue-700)}
      #leadBox p{margin:6px 0;color:#334}
      /* quick replies */
      #quickReplies button.opt{background:rgba(11,107,255,0.06);border:1px solid rgba(11,107,255,0.12);color:var(--blue-600);padding:6px 10px;border-radius:999px;cursor:pointer}
      #optionButtons button.opt{background:#fff;border:1px solid #e6eefc;color:var(--blue-700);padding:8px 10px;margin-right:8px;border-radius:8px;cursor:pointer}
      #optionButtons button.opt:hover{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
      /* compact layout */
      #controls{display:flex;flex-direction:column}
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-toggle.css') }}">
  </head>
  <body>
    <h1>Chat - Bot de Ajuda</h1>
    <div id="messages" aria-live="polite"></div>
    <div id="quickReplies" style="margin:8px 0"></div>

    <div id="controls">
      <div id="identifyBox">
        <label><input type="radio" name="method" value="email" checked> Email</label>
        <label><input type="radio" name="method" value="username"> Usuário</label>
        <input id="identifier" type="text" placeholder="Digite email ou usuário">
        <button id="identify">Identificar</button>
      </div>

      <div id="inputBox" style="display:none">
        <input id="text" type="text" placeholder="Digite sua opção (suporte, financeiro, comercial)">
        <button id="send">Enviar</button>
      </div>

      <div id="optionButtons" style="display:none">
        <button class="opt">Suporte</button>
        <button class="opt">Financeiro</button>
        <button class="opt">Comercial</button>
      </div>

      <div id="leadBox" style="display:none">
        <p>Registrar como lead:</p>
        <input id="lead_name" placeholder="Nome">
        <input id="lead_email" placeholder="Email">
        <input id="lead_phone" placeholder="Telefone">
        <input id="lead_company" placeholder="Empresa">
        <textarea id="lead_message" placeholder="Mensagem"></textarea>
        <button id="lead_send">Enviar Lead</button>
      </div>
    </div>

    <script>
      const messages = document.getElementById('messages');
      const add = (text, cls='bot')=>{
        const d = document.createElement('div'); d.className='msg '+cls; d.textContent=text; messages.appendChild(d); messages.scrollTop = messages.scrollHeight;
      }

      const addWithButtons = (text, buttons = [], cls='bot') => {
        const wrapper = document.createElement('div'); wrapper.className = 'msg '+cls;
        const p = document.createElement('div'); p.textContent = text; p.style.marginBottom = '8px'; wrapper.appendChild(p);
        const btns = document.createElement('div'); btns.style.display = 'flex'; btns.style.flexWrap = 'wrap'; btns.style.gap = '8px';
        buttons.forEach(btxt => {
          const b = document.createElement('button');
          b.textContent = btxt;
          b.style.padding = '6px 10px'; b.style.borderRadius='6px'; b.style.border='1px solid #ccc'; b.style.background='#fff'; b.style.cursor='pointer';
          b.onclick = async ()=>{
            // reflect click as user message
            add(btxt, 'user');
            // handle special client-side actions
            const v = btxt.trim().toLowerCase();
            if(v === 'tenho login'){
              document.getElementById('identifyBox').style.display='block'; document.getElementById('identifier').focus();
              return;
            }
                if(v === 'quero contato do comercial'){
                  document.getElementById('leadBox').style.display='block';
                  return;
                }
            // otherwise send as an option to the server
            try{
              const res = await fetch('/chat/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'option',option:v})});
              const j = await res.json();
              if(j.buttons) addWithButtons(j.reply, j.buttons, 'bot'); else add(j.reply, 'bot');
            }catch(e){ add('Erro de comunicação','bot') }
          };
          btns.appendChild(b);
        });
        wrapper.appendChild(btns);
        messages.appendChild(wrapper);
        messages.scrollTop = messages.scrollHeight;
      }

      // initial bot greeting shown when chat iframe loads (with inline buttons)
      window.addEventListener('DOMContentLoaded', ()=>{
        const welcome = 'Olá - para poder ajudar, poderia me informar seu e-mail ou login de acesso? Caso não tenha, deseja que nossa equipe entre em contato para fornecer acesso e permitir que você anuncie veículos à venda?';
        addWithButtons(welcome, ['Tenho login','Quero contato do comercial'], 'bot');
        const idInput = document.getElementById('identifier');
        if(idInput){ idInput.focus(); }
      });

      function clearQuickReplies(){ const q=document.getElementById('quickReplies'); q.innerHTML=''; }

      function showQuickReplies(items){ const q=document.getElementById('quickReplies'); q.innerHTML=''; items.forEach(it=>{ const b=document.createElement('button'); b.textContent=it; b.style.margin='4px'; b.className='opt'; q.appendChild(b); }); }

      document.getElementById('identify').onclick = async ()=>{
        const method = document.querySelector('input[name="method"]:checked').value;
        const identifier = document.getElementById('identifier').value.trim();
        if(!identifier){ alert('Informe o identificador'); return }
        add(identifier, 'user');
        try{
          const res = await fetch('/chat/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'identify',method,identifier})});
          const j = await res.json();
          if(j.buttons) addWithButtons(j.reply, j.buttons, 'bot'); else add(j.reply,'bot');
          clearQuickReplies();
          if(j.identified){
            document.getElementById('identifyBox').style.display='none';
            document.getElementById('inputBox').style.display='none';
            const opts = document.getElementById('optionButtons'); opts.style.display='block';
            Array.from(opts.querySelectorAll('.opt')).forEach(btn=>btn.onclick = async ()=>{
              const val = btn.textContent.trim().toLowerCase(); add(btn.textContent,'user');
              const res2 = await fetch('/chat/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'option',option:val})});
              const j2 = await res2.json(); if(j2.buttons) addWithButtons(j2.reply, j2.buttons, 'bot'); else add(j2.reply,'bot');
            });
          } else {
            document.getElementById('leadBox').style.display='block';
            document.getElementById('lead_email').value = (method==='email'?identifier:'');
            showQuickReplies(['Quero contato do comercial']);
            // attach handler for 'Quero contato'
            document.getElementById('quickReplies').querySelectorAll('button').forEach(b=>b.onclick = ()=>{ document.getElementById('leadBox').style.display='block'; });
          }
        }catch(e){ add('Erro de comunicação','bot') }
      }

      document.getElementById('send').onclick = async ()=>{
        const text = document.getElementById('text').value.trim(); if(!text) return;
        add(text,'user');
        try{
          const res = await fetch('/chat/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'option',option:text})});
            const j = await res.json(); if(j.buttons) addWithButtons(j.reply, j.buttons, 'bot'); else add(j.reply,'bot');
        }catch(e){ add('Erro de comunicação','bot') }
      }

      document.getElementById('lead_send').onclick = async ()=>{
        const lead = {action:'lead', name:document.getElementById('lead_name').value, email:document.getElementById('lead_email').value, phone:document.getElementById('lead_phone').value, company:document.getElementById('lead_company').value, message:document.getElementById('lead_message').value};
        add('Enviando lead...','user');
        try{
          const res = await fetch('/chat/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)});
          const j = await res.json(); add(j.reply,'bot');
          document.getElementById('leadBox').style.display='none';
          clearQuickReplies();
          showQuickReplies(['Tenho login','Quero contato do comercial']);
          // handlers
          const qbtns = document.getElementById('quickReplies').querySelectorAll('button');
          qbtns.forEach(b=>{ if(b.textContent==='Tenho login') b.onclick=()=>{ document.getElementById('identifyBox').style.display='block'; document.getElementById('identifier').focus(); }; if(b.textContent==='Quero contato do comercial') b.onclick=()=>{ document.getElementById('leadBox').style.display='block'; }; });
        }catch(e){ add('Erro ao enviar lead','bot') }
      }

      // initial quick replies and handlers
      showQuickReplies(['Tenho login','Quero contato do comercial']);
      const initialBtns = document.getElementById('quickReplies').querySelectorAll('button');
      initialBtns.forEach(b=>{
        if(b.textContent==='Tenho login') b.onclick=()=>{ document.getElementById('identifyBox').style.display='block'; document.getElementById('identifier').focus(); };
        if(b.textContent==='Quero contato do comercial') b.onclick=()=>{ document.getElementById('leadBox').style.display='block'; };
      });
    </script>
    <script src="{{ url_for('static', filename='js/theme-toggle.js') }}"></script>
  </body>
</html>
