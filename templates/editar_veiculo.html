<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Editar Veiculo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; }
      .container { max-width: 760px; margin: 24px auto; background: white; padding: 22px; border-radius: 12px; box-shadow: 0 6px 18px rgba(15,23,42,.08); }
      h1 { margin-top: 0; }
      form { display: grid; gap: 10px; }
      label { font-weight: 600; font-size: 14px; }
      input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 4px; }
      .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      button, a { border: 0; border-radius: 8px; padding: 10px 14px; text-decoration: none; font-weight: 600; }
      button { background: #0b6bff; color: white; cursor: pointer; }
      a { background: #1f2937; color: white; }
      .error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
      .required { color: #991b1b; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-toggle.css') }}">
  </head>
  <body>
    <div class="container">
      <h1>Editar Veiculo</h1>
      <p>Altere os dados do veiculo cadastrado.</p>
      <p>Usuario logado: <strong>{{ user.name or user.username }}</strong> - <a href="/logout">Sair</a></p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/cadastro/{{ vehicle_id }}/editar">
        <label>Marca <span class="required">*</span>
          <input name="marca" value="{{ form_data.marca if form_data else '' }}" required>
        </label>
        <label>Modelo <span class="required">*</span>
          <input name="modelo" value="{{ form_data.modelo if form_data else '' }}" required>
        </label>
        <label>Cor
          <input name="cor" placeholder="Ex: Preto, Branco, Vermelho" value="{{ form_data.cor if form_data else '' }}">
        </label>
        <label>Ano <span class="required">*</span>
          <input name="ano" type="number" min="1950" max="2100" value="{{ form_data.ano if form_data else '' }}" required>
        </label>
        <label>Renavam <span class="required">*</span>
          <input name="renavam" value="{{ form_data.renavam if form_data else '' }}" required>
        </label>
        <label>Placa <span class="required">*</span>
          <input name="placa" placeholder="Ex: ABC1D23" value="{{ form_data.placa if form_data else '' }}" required>
        </label>
        <label>Data de vencimento do IPVA <span class="required">*</span>
          <input name="ipva_vencimento" type="date" value="{{ form_data.ipva_vencimento if form_data else '' }}" required>
        </label>
        <label>Preco
          <input id="preco_input" name="preco" placeholder="Ex: 89900 ou 89900,00" value="{{ form_data.preco if form_data else '' }}">
        </label>
        <label>Quilometragem
          <input name="km" placeholder="Ex: 42000" value="{{ form_data.km if form_data else '' }}">
        </label>

        <div class="actions">
          <button type="submit">Salvar alteracoes</button>
          <a href="/cadastro" class="floating-back-btn">Voltar ao cadastro</a>
        </div>
      </form>
    </div>
    <script>
      (function(){
        const preco = document.getElementById('preco_input');
        function parsePrice(v){
          if(!v) return 0.0;
          v = v.toString().replace(/R\$|\s/g,'');
          v = v.replace(/[^\d.,-]/g,'');
          const hasComma = v.includes(',');
          const hasDot = v.includes('.');

          if(hasComma && hasDot){
            if(v.lastIndexOf(',') > v.lastIndexOf('.')){
              v = v.replace(/\./g,'').replace(',', '.');
            }else{
              v = v.replace(/,/g,'');
            }
          }else if(hasComma){
            const parts = v.split(',');
            if(parts.length > 2){
              v = parts.slice(0, -1).join('') + '.' + parts[parts.length - 1];
            }else{
              v = v.replace(',', '.');
            }
          }else if(hasDot){
            const parts = v.split('.');
            if(parts.length > 2){
              const last = parts[parts.length - 1];
              if(last.length <= 2){
                v = parts.slice(0, -1).join('') + '.' + last;
              }else{
                v = parts.join('');
              }
            }else{
              const integerPart = parts[0];
              const decimalPart = parts[1] || '';
              if(decimalPart.length === 3){
                v = integerPart + decimalPart;
              }
            }
          }

          const n = parseFloat(v);
          return isNaN(n)?0.0:n;
        }
        function formatPrice(n){
          return n.toFixed(2);
        }
        if(preco){
          preco.addEventListener('blur', ()=>{
            const v = parsePrice(preco.value);
            if(v === 0){
              if(preco.value.trim()==='') return;
            }
            preco.value = formatPrice(v);
          });
        }
      })();
    </script>
    <script src="{{ url_for('static', filename='js/theme-toggle.js') }}"></script>
  </body>
</html>
