<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registro de Cliente</title>
  </head>
  <body>
    <h1>Registro como cliente</h1>
    <p>Não encontramos o usuário. Preencha seus dados para que o comercial entre em contato.</p>
    <form action="/lead" method="post">
      <div><label>Nome:<br><input name="name" required></label></div>
      <div><label>Email:<br><input name="email" value="{{ prefill.identifier if prefill.method=='email' else '' }}" required></label></div>
      <div><label>Telefone:<br><input name="phone"></label></div>
      <div><label>Empresa:<br><input name="company"></label></div>
      <div><label>Mensagem:<br><textarea name="message"></textarea></label></div>
      <button type="submit">Enviar</button>
    </form>
    <p><a href="/">Voltar</a></p>
  </body>
</html>
<!-- Chat widget: floating button + modal -->
<div id="chat-widget">
  <button id="chat-toggle" aria-label="Abrir chat">💬</button>
  <div id="chat-modal" role="dialog" aria-hidden="true">
    <div id="chat-header">Atendimento <button id="chat-close">✖</button></div>
    <iframe src="/chat" id="chat-iframe" title="Chat de Ajuda"></iframe>
  </div>
</div>

<style>
  #chat-toggle{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#0b6bff,#1aa261);color:#fff;border:none;font-size:24px;cursor:pointer;z-index:9999;box-shadow:0 8px 20px rgba(11,107,255,0.18)}
  #chat-modal{position:fixed;right:18px;bottom:86px;width:min(420px,95%);height:min(560px,80vh);background:#fff;border-radius:12px;box-shadow:0 18px 40px rgba(2,24,71,0.18);display:none;overflow:hidden;z-index:9999}
  #chat-header{background:linear-gradient(90deg,#0b6bff,#1aa261);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
  #chat-header button{background:transparent;border:0;color:#fff;font-size:16px;cursor:pointer}
  #chat-iframe{width:100%;height:100%;border:0}
  @media (max-width:480px){ #chat-modal{right:8px;left:8px;width:auto;height:70vh;bottom:16px;border-radius:8px} }
</style>

<script>
  const toggle = document.getElementById('chat-toggle');
  const modal = document.getElementById('chat-modal');
  const closeBtn = document.getElementById('chat-close');
  toggle.addEventListener('click', ()=>{ modal.style.display = modal.style.display==='block' ? 'none' : 'block'; modal.setAttribute('aria-hidden', modal.style.display!=='block'); });
  closeBtn.addEventListener('click', ()=>{ modal.style.display='none'; modal.setAttribute('aria-hidden','true'); });
</script>
